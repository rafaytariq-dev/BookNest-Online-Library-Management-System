apiVersion: apps/v1
kind: Deployment
metadata:
  name: booknest-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booknest-frontend
  template:
    metadata:
      labels:
        app: booknest-frontend
    spec:
      containers:
        - name: frontend
          image: booknest-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
