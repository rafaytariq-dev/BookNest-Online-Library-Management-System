apiVersion: apps/v1
kind: Deployment
metadata:
  name: booknest-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booknest-backend
  template:
    metadata:
      labels:
        app: booknest-backend
    spec:
      containers:
        - name: backend
          image: booknest-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            # Minikube usually runs over plain HTTP; secure cookies would not be set.
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: booknest-backend-secret
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: booknest-backend-secret
                  key: SESSION_SECRET
